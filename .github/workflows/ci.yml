name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # No browser or playwright install: the browser tests skip themselves via
    # an availability probe when no browser is present.
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,console]"
      - run: ruff check src tests
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,console]"
      # Installed inline so the locked dev extra stays untouched.
      - run: pip install pip-audit
      # Advisory only: a vulnerability finding must not red the run.
      - run: pip-audit
        continue-on-error: true
