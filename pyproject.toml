[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loom"
description = "Self-hosted personal agent (LangGraph + Docker)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NorthAdb" }]
keywords = ["personal-agent", "langgraph", "docker"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NorthAdb/Loom"
Repository = "https://github.com/NorthAdb/Loom"
Documentation = "https://github.com/NorthAdb/Loom/blob/main/docs/STATUS.md"

[tool.hatch.version]
path = "src/loom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]
