[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loom"
description = "Self-hosted personal agent (LangGraph + Docker)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NorthAdb" }]
keywords = ["personal-agent", "langgraph", "docker"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "python-dateutil>=2.9",
  "pydantic-settings>=2.0",
  "langgraph>=1.2,<2",
  "langchain-core>=1.7,<2",
  "langchain-openai>=1.7,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "apscheduler>=3.11,<4",
  "mem0ai>=2.2,<3",
  "icalendar>=7.3,<8",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/NorthAdb/Loom"
Repository = "https://github.com/NorthAdb/Loom"
Documentation = "https://github.com/NorthAdb/Loom/blob/main/docs/STATUS.md"

[project.scripts]
loom = "loom.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/loom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.ruff]
line-length = 120
